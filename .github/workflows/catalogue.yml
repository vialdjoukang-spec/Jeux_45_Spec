# Catalogue de captures (0 token) : à chaque changement du réseau, refait 3 planches par système jouable sur le corps 3D réel
# et publie conception/catalogue/. Signature : AAI (Anthropic AI)
name: Catalogue des systèmes
on:
  push:
    branches: [main]
    paths: ["conception/prototypes/moteur/tetrade.json", "conception/prototypes/moteur/fenetres.js", "conception/prototypes/moteur/reseau3d.html"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue
  cancel-in-progress: true
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/cache@v4
        with:
          path: conception/prototypes/moteur/corps.glb
          key: corps-${{ hashFiles('skills/3d-images-upload-super/scripts/*.py') }}
      - name: Outils
        run: |
          pip install -q trimesh fast-simplification numpy pillow playwright
          python -m playwright install --with-deps chromium > /dev/null
          mkdir -p /tmp/n && npm i --prefix /tmp/n -s three@0.170.0 > /dev/null
          ln -sfn /tmp/n/node_modules/three conception/prototypes/moteur/three
      - name: Construire le catalogue
        run: python conception/outils/catalogue/construire_catalogue.py
      - name: Publier
        run: |
          git config user.name "catalogue-auto"; git config user.email "catalogue-auto@users.noreply.github.com"
          git add conception/catalogue
          git diff --cached --quiet || git commit -q -m "Catalogue des systèmes : captures à jour [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main

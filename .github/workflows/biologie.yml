# Audit mécanique BLOQUANT de l'onglet Biologie du jeu Paraclinique (BRIEF_BIOLOGIE_CLAUDE_CODE.md § 5).
# Tourne sur toute PR ou poussée qui touche les fiches, les outils ou la page ; 0 token, aucun secret.
# Signature : AAI (Anthropic AI)
name: Biologie · audit mécanique
on:
  pull_request:
    paths:
      - "conception/donnees/paraclinique/biologie/**"
      - "conception/outils/paraclinique/**"
      - "conception/prototypes/paraclinique/**"
  push:
    branches: [main]
    paths:
      - "conception/donnees/paraclinique/biologie/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Audit A1–A10 (8 blocs, chiffres sourcés, AIPS, SI, verbes, ids, passerelles, non-perte, sources datées)
        run: python conception/outils/paraclinique/auditer_biologie.py --liste
      - name: Construction du réseau (chaque lien pointe vers une case existante)
        run: pip install -q pillow && python conception/outils/paraclinique/construire_jeu_paraclinique.py | tail -1

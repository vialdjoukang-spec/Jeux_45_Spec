# Tableau de bord live : mesure le dépôt (0 token) et publie tableau/donnees/*.json sur main.
# La page tableau/index.html lit ces JSON (raw main) chaque minute. Skill : gratis-dashboard-live. Signature : AAI (Anthropic AI)
name: Tableau de bord live
on:
  schedule: [{cron: "*/10 * * * *"}]
  push:
    branches: [main]
    paths: ["content/**", "projets/jauges.json", "projets/ouvrier/**", "REPRISE.md", "projets/outils/mesurer_tableau.py", "tableau/index.html", ".github/workflows/tableau.yml"]
  workflow_dispatch:
concurrency: {group: tableau, cancel-in-progress: false}
permissions: {contents: write, actions: read}
jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Mesurer (main, branches agent/*, file API de veille/audit-medical, API GitHub)
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          python3 projets/outils/mesurer_tableau.py
          rm -rf /tmp/donnees && cp -r tableau/donnees /tmp/donnees
      - name: Publier si une donnée a bougé
        run: |
          git config user.name "tableau-bot"; git config user.email "tableau-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p tableau && rm -rf tableau/donnees && cp -r /tmp/donnees tableau/donnees
            git add tableau/donnees
            # Ne commiter que si autre chose que les horodatages a changé
            if git diff --cached --quiet; then exit 0; fi
            if [ -z "$(git diff --cached -U0 | grep '^[+-][^+-]' | grep -v '"maj":' )" ]; then echo "Seuls les horodatages ont changé"; exit 0; fi
            git commit -qm "Tableau : $(python3 -c "import json;print(json.load(open('tableau/donnees/etat.json'))['verdict'])") [skip ci]"
            git push -q origin main && exit 0; sleep 7
          done

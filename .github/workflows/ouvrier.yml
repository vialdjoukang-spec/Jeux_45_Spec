# Ouvrier en chaîne : prend la tâche suivante de projets/ouvrier/FILE_PROCESSUS.json, l'exécute avec Claude par l'API
# Anthropic (secret ANTHROPIC_API_KEY), sous plafond de dépense, et publie sur la branche veille/audit-medical.
# Rien n'arrive sur main sans l'audit médical horaire de Claude. Signature : AAI (Anthropic AI)
name: Ouvrier en chaîne (API Anthropic)
on:
  # PAUSE du 24.11.2026 (décision de Vial) : crédit API épuisé jusqu'à jeudi ; T4 avance sur l'abonnement (projets/ouvrier/T4_ABONNEMENT.md).
  # Pour relancer : décommenter les 5 lignes ci-dessous.
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min ; file.py applique le plafond journalier
  push:
    branches: [main]
    paths: ["projets/ouvrier/FILE_PROCESSUS.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write           # pour se désactiver seul au premier refus définitif de l'API
concurrency:
  group: veille            # même groupe que la veille : jamais deux écritures simultanées sur la branche
  cancel-in-progress: false
env:
  BRANCHE: veille/audit-medical
jobs:
  ouvrier:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Se placer sur la branche d'audit médical
        run: |
          git config user.name "ouvrier-auto"
          git config user.email "ouvrier-auto@users.noreply.github.com"
          if git fetch origin "+refs/heads/$BRANCHE:refs/remotes/origin/$BRANCHE" 2>/dev/null \
             && ! git merge-base --is-ancestor "origin/$BRANCHE" origin/main; then
            git checkout -B "$BRANCHE" "origin/$BRANCHE"
            if ! git merge --no-edit origin/main; then
              autres=$(git diff --name-only --diff-filter=U | grep -v -e '^CLAUDE_A_AUDITER/RAPPORT_' -e '^CLAUDE_A_AUDITER/EN_ATTENTE_AUDIT_MEDICAL.json$' -e '^projets/retours/veille_traites.json$' -e '^projets/ouvrier/' || true)
              if [ -n "$autres" ]; then git merge --abort; echo "conflit de données avec main : $autres" >&2; exit 1; fi
              git checkout --ours -- $(git diff --name-only --diff-filter=U) && git add -A && git commit --no-edit -q
            fi
          else
            git checkout -B "$BRANCHE" origin/main
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Prendre la tâche suivante
        id: file
        run: python projets/ouvrier/file.py prendre
      - uses: actions/setup-node@v4
        if: steps.file.outputs.tache != ''
        with: { node-version: "22" }
      - name: Exécuter une tâche de type script (fiches et items du 45 Spec)
        if: steps.file.outputs.mode == 'script'
        continue-on-error: true
        timeout-minutes: 120
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -q anthropic jsonschema
          set +e; bash /tmp/commande.sh > /tmp/sortie_script.txt 2>&1; echo $? > /tmp/script_ok; set -e
          tail -40 /tmp/sortie_script.txt
          python projets/ouvrier/file.py comptabiliser
      - name: Exécuter la tâche avec Claude
        if: steps.file.outputs.mode == 'claude'
        continue-on-error: true
        timeout-minutes: 120
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WS: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          [ -z "$WS" ] && [ -f projets/ouvrier/workspace_id.txt ] && WS=$(tr -d ' \r\n' < projets/ouvrier/workspace_id.txt)   # identifiant d'espace de travail (pas un secret)
          if [ -n "$WS" ]; then export ANTHROPIC_CUSTOM_HEADERS="anthropic-workspace-id: $WS"; fi   # clé non rattachée à un espace de travail
          pip install -q playwright >/dev/null 2>&1 && python -m playwright install --with-deps chromium >/dev/null 2>&1 || true
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude -p "$(cat /tmp/prompt.txt)" --model "${{ steps.file.outputs.modele }}" \
            --max-budget-usd "${{ steps.file.outputs.budget }}" --output-format json \
            --dangerously-skip-permissions > /tmp/resultat.json 2> /tmp/erreurs.txt || true
          tail -c 1500 /tmp/erreurs.txt || true
          echo '--- résultat (début) ---'; head -c 1200 /tmp/resultat.json || true
      - name: Enregistrer le coût et l'état
        id: fin
        if: steps.file.outputs.tache != ''
        env:
          MODELE: ${{ steps.file.outputs.modele }}
        run: python projets/ouvrier/file.py terminer "${{ steps.file.outputs.tache }}" ${{ steps.file.outputs.mode == 'script' && '-' || '/tmp/resultat.json' }}
      - name: Refus définitif de l'API → pause sur main et désactivation de l'ouvrier
        if: steps.fin.outputs.fatal == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # aucun commit sur la branche d'audit (rien de produit) ; la pause seule va sur main, puis le workflow s'éteint
          cp projets/ouvrier/FILE_PROCESSUS.json /tmp/file_pause.json
          git reset -q --hard && git fetch -q origin main && git checkout -q -B pause origin/main
          python3 -c "import json;p=json.load(open('/tmp/file_pause.json'))['pause'];f='projets/ouvrier/FILE_PROCESSUS.json';F=json.load(open(f));F['pause']=p;json.dump(F,open(f,'w'),ensure_ascii=False,indent=1)"
          git commit -qam "Ouvrier en pause : ${{ steps.fin.outputs.raison }} [skip ci]" && git -c push.negotiate=true push -q origin HEAD:main || true
          gh workflow disable ouvrier.yml -R "${{ github.repository }}" || true
          echo "::error::Ouvrier arrêté : ${{ steps.fin.outputs.raison }}. Pour relancer : retirer « pause » de FILE_PROCESSUS.json et réactiver le workflow."
      - name: Publier sur la branche d'audit médical
        if: steps.file.outputs.tache != '' && steps.fin.outputs.fatal != '1'
        run: |
          git add -A
          git diff --cached --quiet || git commit -q -m "Ouvrier : ${{ steps.file.outputs.tache }} (en attente d'audit médical) [skip ci]"
          for i in 1 2 3; do
            if git rev-parse -q --verify "origin/$BRANCHE" > /dev/null; then
              git fetch -q origin "+refs/heads/$BRANCHE:refs/remotes/origin/$BRANCHE"
              { git merge --no-edit -q "origin/$BRANCHE" || python3 projets/ouvrier/fusion_file.py; } && git push -q origin "$BRANCHE" && exit 0   # fusion, jamais de rebase ; conflit de suivi résolu par script
            else
              git push -q origin "$BRANCHE" && exit 0
            fi
            git merge --abort 2>/dev/null || true; sleep 10
          done
          git push -q origin "HEAD:refs/heads/ouvrier/sauvegarde-${{ github.run_id }}"   # rien ne se perd
          echo "branche d'audit occupée : travail sauvegardé sur ouvrier/sauvegarde-${{ github.run_id }}" >&2; exit 1
      - name: "Enchaîner le passage suivant (tempête du 26.11, sans attente de 30 min)"
        if: always() && steps.file.outputs.tache != '' && steps.fin.outputs.fatal != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ouvrier.yml -R "${{ github.repository }}" --ref main || true

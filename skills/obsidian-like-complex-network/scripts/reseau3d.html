<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(atk400.woff2)}@font-face{font-family:A;font-weight:700;src:url(atk700.woff2)}
html,body{margin:0;background:radial-gradient(ellipse at 50% 40%,#22324a 0%,#0e1622 70%);width:1600px;height:1000px;overflow:hidden;font-family:A,sans-serif}
#gl,#ln{position:absolute;inset:0}
.n{position:absolute;padding:6px 11px;border-radius:7px;font-size:13px;line-height:1.25;color:#e8edf3;background:#1d2836ee;border:1px solid #3b4b63;box-shadow:0 2px 8px #0006;white-space:nowrap;transform:translateY(-50%)}
.n b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.r{border-left:4px solid var(--c)}.l{border-right:4px solid var(--c)}
h1{position:absolute;left:28px;top:14px;margin:0;color:#f2f4f7;font:700 20px A,sans-serif}
h1 small{display:block;font-weight:400;font-size:13px;opacity:.7}
</style></head><body><canvas id="gl" width="1600" height="1000"></canvas><canvas id="ln" width="1600" height="1000"></canvas><h1 id="t"></h1>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const C=await (await fetch(location.hash.slice(1)||'config.json')).json();
document.getElementById('t').innerHTML=C.titre+'<small>'+C.sousTitre+'</small>';
const R=new THREE.WebGLRenderer({canvas:gl,antialias:true,alpha:true,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setSize(1600,1000,false);
R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;
const S=new THREE.Scene();
S.add(new THREE.HemisphereLight(0xdfe8ff,0x2a1a14,1.4));const d=new THREE.DirectionalLight(0xffffff,2.2);d.position.set(-600,-1200,1900);S.add(d);
const d2=new THREE.DirectionalLight(0x9ab8ff,1.0);d2.position.set(900,-300,600);S.add(d2);
const cam=new THREE.PerspectiveCamera(C.fov||24,1.6,10,10000);const T=C.cible||[0,-80,900];
cam.up.set(0,0,1);cam.position.set(T[0]+(C.camX||0),T[1]-(C.dist||3900),T[2]+(C.camZ||120));cam.lookAt(...T);
const g=await new GLTFLoader().loadAsync('corps.glb');const M={};
g.scene.traverse(o=>{if(o.isMesh){const k=o.name.replace(/_\d+$/,'');M[k]=o;o.geometry.computeVertexNormals();
 const col=o.geometry.attributes.color;let c=new THREE.Color(.8,.6,.5);if(col)c.setRGB(col.getX(0),col.getY(0),col.getZ(0));
 const peau=k==='peau';const vis=(C.masquer||[]).includes(k)?false:true;o.visible=vis;
 const m=new THREE.MeshPhysicalMaterial({color:c,roughness:peau?.55:.45,metalness:0,clearcoat:peau?0:.35,clearcoatRoughness:.4,transparent:peau,opacity:peau?(C.opacitePeau??.22):1,depthWrite:!peau,side:peau?THREE.FrontSide:THREE.DoubleSide});
 if(peau){const B=C.voile;m.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vW;').replace('#include <begin_vertex>','#include <begin_vertex>\nvW=position;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vW;').replace('void main() {','void main() {\nif(vW.x>'+B[0]+'.&&vW.x<'+B[3]+'.&&vW.y>'+B[1]+'.&&vW.y<'+B[4]+'.&&vW.z>'+B[2]+'.&&vW.z<'+B[5]+'.)discard;');};}
 o.material=m;}});
g.scene.traverse(o=>{if(o.isMesh)o.name=o.name.replace(/_\d+$/,'')});
S.add(g.scene);
R.render(S,cam);
/* réseau type Obsidian : courbes de Bézier à tangentes horizontales, flèches, sur canvas 2D */
const x=ln.getContext('2d');const P=k=>{const b=new THREE.Box3().setFromObject(M[k]);const c=b.getCenter(new THREE.Vector3());if(C.ancres&&C.ancres[k])c.set(...C.ancres[k]);c.project(cam);return[(c.x+1)/2*1600,(1-c.y)/2*1000];};
function noeud(n,X,Y,cote){const e=document.createElement('div');e.className='n '+(cote==='g'?'l':'r');e.style.setProperty('--c',n.couleur||'#e8a33d');
 e.innerHTML=(n.type?'<b style="color:'+(n.couleur||'#e8a33d')+'">'+n.type+'</b>':'')+n.texte;document.body.appendChild(e);
 const w=e.offsetWidth;e.style.left=(cote==='g'?X-w:X)+'px';e.style.top=Y+'px';return {e,w};}
function lien(a,b,col,label,fleche=true,boucle=0){const dx=boucle?boucle:Math.max(60,Math.abs(b[0]-a[0])*.5)*Math.sign(b[0]-a[0]||1);const dxb=boucle?-boucle:dx;
 x.strokeStyle=col;x.globalAlpha=.85;x.lineWidth=1.6;x.beginPath();x.moveTo(...a);x.bezierCurveTo(a[0]+dx,a[1],b[0]-dxb,b[1],...b);x.stroke();
 if(fleche){const s=Math.sign(dxb);x.globalAlpha=1;x.fillStyle=col;x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(b[0]-9*s,b[1]-4.5);x.lineTo(b[0]-9*s,b[1]+4.5);x.fill();}
 if(label){x.font='11px A';x.fillStyle='#b9c4d4';const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];x.globalAlpha=1;x.fillText(label,m[0]-x.measureText(label).width/2,m[1]-5);}x.globalAlpha=1;}
const cols={g:[],d:[]};for(const c of C.colonnes){if(c.trierParOrgane!==false&&c.noeuds.every(n=>n.organe))c.noeuds.sort((a,b)=>P(a.organe)[1]-P(b.organe)[1]);const els=[];const n=c.noeuds.length;
 c.noeuds.forEach((nd,i)=>{const Y=c.yMin+(c.yMax-c.yMin)*(n===1?.5:i/(n-1));const r=noeud(nd,c.x,Y,c.cote);els.push({nd,Y,...r});});cols[c.id]=els;c._els=els;}
for(const c of C.colonnes)for(const it of c._els){const nd=it.nd;const bord=c.cote==='g'?c.x:c.x;
 if(nd.organe){const p=P(nd.organe);x.fillStyle=nd.couleur||'#e8a33d';x.beginPath();x.arc(p[0],p[1],4.5,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();lien(p,[bord-(c.cote==='g'?2:-2)*0,it.Y],nd.couleur||'#e8a33d',nd.lien,true);}
 for(const v of nd.vers||[]){const [cid,j]=v.split(':');const tc=C.colonnes.find(q=>q.id===cid);const t=tc._els[+j];
  const a=nd.organe?P(nd.organe):[c.cote==='g'?c.x-it.w:c.x+it.w,it.Y];const b=[tc.cote==='g'?tc.x-t.w:tc.x,t.Y];
  if(tc.cote===c.cote&&!nd.organe){if(tc.x===c.x){const A=c.cote==='g'?[c.x-it.w,it.Y]:[c.x+it.w,it.Y];const Bp=c.cote==='g'?[tc.x-t.w,t.Y]:[tc.x+t.w,t.Y];lien(A,Bp,nd.couleur||'#8aa0bd',null,true,c.cote==='g'?-70:70);}else{const A=[c.x+it.w,it.Y];lien(A,[tc.x,t.Y],nd.couleur||'#8aa0bd',null,true);}}else lien(a,b,'#8aa0bd',null,true);}}

if(C.fenetre){const F=C.fenetre;const w=document.createElement('div');w.style.cssText='box-sizing:border-box;position:absolute;left:'+F.x+'px;top:'+F.y+'px;width:'+F.w+'px;background:#111a26f2;border:1px solid #3b4b63;border-radius:10px;padding:10px;box-shadow:0 6px 24px #0008;color:#e8edf3;font-size:12.5px';
 const iw=(F.w-30)/2;w.innerHTML='<div style="font-weight:700;margin-bottom:6px">'+F.titre+'</div><div style="display:flex;gap:10px"><div><div style="opacity:.7;margin-bottom:3px">Cliché brut</div><img id=i1 src="'+F.img+'" style="width:'+iw+'px;display:block;border-radius:4px"></div><div style="position:relative"><div style="opacity:.7;margin-bottom:3px">Cliché annoté</div><img id=i2 src="'+F.img+'" style="width:'+iw+'px;display:block;border-radius:4px"><canvas id=ca style="position:absolute;left:0;top:19px"></canvas></div></div><ol id=lg style="margin:8px 0 0 18px;padding:0;line-height:1.45"></ol>';
 document.body.appendChild(w);await new Promise(r=>{const im=document.getElementById('i2');im.complete?r():im.onload=r});
 const im=document.getElementById('i2'),cv=document.getElementById('ca');cv.width=im.width;cv.height=im.height;const q=cv.getContext('2d'),k=im.width/im.naturalWidth;
 for(const a of F.annotations){q.strokeStyle=a.couleur||'#ffd166';q.lineWidth=2;q.setLineDash(a.pointille?[5,4]:[]);q.beginPath();q.ellipse(a.x*k,a.y*k,a.rx*k,a.ry*k,0,0,7);q.stroke();q.setLineDash([]);
  q.fillStyle=a.couleur||'#ffd166';q.beginPath();q.arc(a.x*k+a.rx*k*.75,a.y*k-a.ry*k*.75,9,0,7);q.fill();q.fillStyle='#111';q.font='700 11px A';q.fillText(a.n,a.x*k+a.rx*k*.75-3.5,a.y*k-a.ry*k*.75+4);
  const li=document.createElement('li');li.innerHTML=a.texte;li.style.color='#e8edf3';document.getElementById('lg').appendChild(li);}
 if(F.depuis){const tc=C.colonnes.find(c=>c.id===F.depuis.split(':')[0]),t=tc._els[+F.depuis.split(':')[1]];lien([tc.x+t.w,t.Y],[F.x,F.y+40],'#4ecdc4',null,true);}}
document.title='PRET';
</script></body></html>

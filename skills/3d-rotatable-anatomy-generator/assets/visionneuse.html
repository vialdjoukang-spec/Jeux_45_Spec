<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomie 3D rotative</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#fdfcf9,#e9e5dc);font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:#1d1d1f;overflow:hidden}
canvas{display:block}
#panneau{position:fixed;top:14px;left:14px;width:230px;max-height:calc(100% - 28px);overflow:auto;background:#fffffff0;border:1px solid #ddd6c8;border-radius:12px;padding:12px 14px;box-shadow:0 2px 10px #0001}
#panneau h1{font-size:15px;margin:0 0 8px}
label{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer}
label i{width:11px;height:11px;border-radius:3px;display:inline-block}
.ligne{margin-top:10px;border-top:1px solid #eee;padding-top:8px}
button{font:inherit;border:1px solid #ccc4b4;background:#f7f4ee;border-radius:7px;padding:4px 9px;cursor:pointer;margin:2px 2px 0 0}
#source{position:fixed;right:12px;bottom:10px;font-size:11.5px;color:#6b665c;max-width:420px;text-align:right}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="panneau"><h1 id="titre">Anatomie 3D</h1><div id="liste"></div>
<div class="ligne">Transparence <input id="opacite" type="range" min="0.15" max="1" step="0.05" value="1"></div>
<div class="ligne"><button id="tourner">⟳ Rotation</button><button id="face">Face</button><button id="profil">Profil</button><button id="haut">Dessus</button></div></div>
<div id="source"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P = new URLSearchParams(location.search);
const fichier = P.get('glb') || 'modele.glb';
document.getElementById('titre').textContent = P.get('titre') || 'Anatomie 3D';
document.getElementById('source').textContent = P.get('source') || '';
const rendu = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
rendu.setPixelRatio(devicePixelRatio); rendu.setSize(innerWidth, innerHeight); document.body.appendChild(rendu.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 20000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.6));
const sol = new THREE.DirectionalLight(0xffffff, 1.4); sol.position.set(300, 500, 400); scene.add(sol);
const ctl = new OrbitControls(cam, rendu.domElement); ctl.enableDamping = true; ctl.autoRotate = P.has('tourner'); ctl.autoRotateSpeed = 1.2;
let rayon = 200;
const vue = v => { const d = rayon / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) / Math.min(1, cam.aspect) * 1.05; cam.position.copy(v.clone().normalize().multiplyScalar(d)); cam.lookAt(0, 0, 0); ctl.update(); };
// glTF est en Y-haut ; les volumes RAS sont en Z-haut : on redresse le modèle.
new GLTFLoader().load(fichier, g => {
  const racine = g.scene; racine.rotation.x = -Math.PI / 2; scene.add(racine);
  const boite = new THREE.Box3().setFromObject(racine); rayon = boite.getSize(new THREE.Vector3()).length() / 2;
  racine.position.sub(boite.getCenter(new THREE.Vector3()));
  const liste = document.getElementById('liste'), mats = [];
  racine.traverse(o => { if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .55, metalness: .05, transparent: true, side: THREE.DoubleSide });
    mats.push(o.material);
    const c = o.geometry.attributes.color, rgb = c ? `rgb(${Math.round(c.getX(0)*255)},${Math.round(c.getY(0)*255)},${Math.round(c.getZ(0)*255)})` : '#ccc';
    const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" checked><i style="background:${rgb}"></i>${(o.name || o.parent.name).replace(/_/g, ' ')}`;
    l.firstChild.onchange = e => o.visible = e.target.checked; liste.appendChild(l); });
  document.getElementById('opacite').oninput = e => mats.forEach(m => { m.opacity = +e.target.value; m.depthWrite = m.opacity > .95; });
  vue(new THREE.Vector3(0, 0, 1)); document.title = 'PRET';
}, undefined, e => { document.getElementById('liste').textContent = 'Modèle introuvable : ' + fichier; document.title = 'ERREUR'; });
document.getElementById('tourner').onclick = () => ctl.autoRotate = !ctl.autoRotate;
document.getElementById('face').onclick = () => vue(new THREE.Vector3(0, 0, 1));
document.getElementById('profil').onclick = () => vue(new THREE.Vector3(1, 0, 0));
document.getElementById('haut').onclick = () => vue(new THREE.Vector3(0, 1, 0.001));
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); rendu.setSize(innerWidth, innerHeight); });
(function boucle() { requestAnimationFrame(boucle); ctl.update(); rendu.render(scene, cam); })();
</script>
</body>
</html>

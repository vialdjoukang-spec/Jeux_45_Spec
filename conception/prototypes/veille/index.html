<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille Examen fédéral</title>
<!-- Page commune aux 4 jeux : lit veille/examen_federal.json (copie donnees.js) et le suivi de préparation. AAI (Anthropic AI) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Atkinson Hyperlegible";src:url(../../outils/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Atkinson Hyperlegible";src:url(../../outils/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--bg:#e3f2fd;--carte:#fff;--ink:#1d2230;--sous:#4f5869;--trait:#b9cce0;--acc:#1f5fbf;--off:#1f7a45;--ded:#9a5b00;--np:#6b7280}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Atkinson Hyperlegible",sans-serif}
aside{position:fixed;inset:0 auto 0 0;width:250px;padding:24px 16px;border-right:1px solid var(--trait);overflow:auto;background:#d6eafb}
aside .titre{font:700 17px Georgia,serif;margin:0 0 4px}aside .maj{font-size:12.5px;color:var(--sous);margin:0 0 14px}
aside ol{list-style:none;margin:0;padding:0;counter-reset:s}aside li a{display:flex;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
aside li a::before{counter-increment:s;content:counter(s);min-width:18px;color:var(--acc);font-weight:700}aside li a:hover,aside li a.cur{background:var(--carte)}
aside .retour{margin-top:16px;font-size:13px}aside .retour a{display:block;color:var(--acc);padding:3px 0}
main{margin-left:250px;padding:30px 28px 80px}.col{max-width:760px;margin:0 auto}
h1{font:700 30px/1.2 Georgia,serif;margin:0 0 6px}h2{font:700 21px/1.3 Georgia,serif;margin:42px 0 10px;scroll-margin-top:16px}
.lead{color:var(--sous);margin:0 0 20px;max-width:64ch}
.decompte{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0 6px}
.cd{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:14px 16px}
.cd .j{font:700 40px/1 Georgia,serif;font-variant-numeric:tabular-nums}.cd .l{font-weight:700;margin-top:6px}.cd .d{color:var(--sous);font-size:13.5px}
table{border-collapse:collapse;width:100%;background:var(--carte);border:1px solid var(--trait);border-radius:8px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #e3ebf3;text-align:left;vertical-align:top}th{font-size:13px;color:var(--sous);background:#f3f8fd}
td.v{font-weight:700}tr:last-child td{border-bottom:0}
.st{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.st.officiel{color:var(--off)}.st.deduction{color:var(--ded)}.st.deduction::before{border-radius:2px}.st.non_publie{color:var(--np)}.st.non_publie::before{background:none;border:2px solid currentColor;width:6px;height:6px}
.auto{font-size:12px;color:var(--sous)}
[data-i]{border-bottom:1px dotted var(--sous);cursor:help}a{color:var(--acc)}
.att{display:block;font-weight:400;color:var(--ded);margin-top:3px}
#bulle{position:fixed;z-index:50;display:none;max-width:340px;background:var(--ink);color:#fff;font-size:13px;line-height:1.45;padding:8px 11px;border-radius:6px;pointer-events:none}
.liens{columns:2;padding-left:18px}.liens li{break-inside:avoid;margin:0 0 6px}
.vide{background:var(--carte);border:1px dashed var(--trait);border-radius:8px;padding:14px}
a:focus-visible,button:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
@media(max-width:820px){aside{position:static;width:auto;border-right:0;border-bottom:1px solid var(--trait)}main{margin:0;padding:20px 14px}.liens{columns:1}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>
<body>
<aside><p class="titre">Veille Examen fédéral</p><p class="maj" id="maj">Chargement…</p><ol id="sommaire"></ol>
<div class="retour"><a href="../moteur/arene.html">Arène commune (Tétrade, Paraclinique, Transversal)</a><a href="../arene45/index.html">MedSuisse Arena 45</a></div></aside>
<main><div class="col" id="page"><h1>Examen fédéral de médecine humaine</h1><p class="lead">La page se charge.</p></div></main>
<div id="bulle" role="tooltip"></div>
<script src="donnees.js"></script>
<script src="../commun/suivi.js" data-bouton="non"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=window.VEILLE;
const ISO=/^\d{4}-\d{2}-\d{2}$/;
const date=iso=>new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const val=v=>Array.isArray(v)?(v.every(x=>ISO.test(x))?(v.length===2&&v[0].slice(0,7)!==v[1].slice(0,7)?'du '+date(v[0])+' au '+date(v[1]):v.map(date).join(' et ')):v.join(', ')):(v==null?'—':ISO.test(v)?date(v):String(v));
const ST={officiel:['officiel','Officiel','La valeur vient d’une source officielle OFSP/MEBEKO.'],deduction:['deduction','Déduction','La valeur se déduit d’une règle constante ; elle n’est pas officielle.'],non_publie:['non_publie','Non publié','La source officielle ne publie pas encore cette valeur.']};
const badge=s=>{const x=ST[s]||ST.officiel;return `<span class="st ${x[0]}" data-i="${esc(x[2])}">${x[1]}</span>`;};
const jours=iso=>Math.ceil((new Date(iso+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
if(!V){$('#page').innerHTML='<h1>Examen fédéral de médecine humaine</h1><p class="vide">Le fichier de veille manque : lance le workflow « Veille Examen fédéral » dans GitHub Actions, puis recharge la page.</p>';$('#maj').textContent='';return;}

const F=Object.fromEntries(V.faits.map(f=>[f.id,f]));
const S=V.session_suivante,C=V.session_courante,sec=[];
// compte à rebours : la date officielle prime, sinon la déduction marquée comme telle
const cible=(id,lib)=>{const f=F[id];if(!f)return null;const off=Array.isArray(f.valeur)&&f.valeur.length&&ISO.test(f.valeur[0]);const iso=off?f.valeur[0]:(f.attendu_iso||(ISO.test(f.attendu||'')?f.attendu:null));if(!iso)return null;return {lib,iso,off,f};};
const cibles=[cible('delai_inscription_'+S,'Délai d’inscription '+S),cible('qcm_'+S,'Premier jour du QCM '+S),cible('delai_inscription_'+C,'Délai d’inscription '+C),cible('qcm_'+C,'Premier jour du QCM '+C)].filter(x=>x&&jours(x.iso)>=0).slice(0,3);
let h=`<h1>Examen fédéral de médecine humaine</h1>
<p class="lead">Un robot gratuit relit chaque jour les pages et les PDF officiels de l'OFSP et de la MEBEKO ; il note la source, la date de lecture et l'empreinte de chaque fait, puis il ouvre une alerte dès qu'une valeur change ou que le tableau ${S} paraît.</p>
<div class="decompte" id="decompte">${cibles.map(c=>`<div class="cd"><div class="j">J−${jours(c.iso)}</div><div class="l">${esc(c.lib)}</div><div class="d">${date(c.iso)}</div><div style="margin-top:6px">${badge(c.off?'officiel':'deduction')}</div></div>`).join('')}</div>`;
sec.push(['decompte','Compte à rebours']);

// sessions puis rubriques
const lignes=L=>`<table><thead><tr><th style="width:34%">Élément</th><th>Valeur</th><th style="width:16%">Statut</th></tr></thead><tbody>${L.map(f=>{
  const tip=[f.infobulle,f.extrait&&('Extrait : '+f.extrait),'Consulté le '+(f.consulte_le||'—')+(f.sha256?' · empreinte '+f.sha256.slice(0,12):' · empreinte en attente du premier passage du robot')].filter(Boolean).join(' — ');
  const v=f.statut==='non_publie'&&f.attendu?`Non publié<span class="att" data-i="${esc(f.attendu_note||'')}">Attendu : ${esc(ISO.test(f.attendu)?date(f.attendu):f.attendu)} (déduction)</span>`:esc(val(f.valeur));
  return `<tr><td><span data-i="${esc(tip)}">${esc(f.libelle)}</span><div class="auto"><a href="${esc(f.source)}" target="_blank" rel="noopener">source</a>${f.verifie_auto?' · relu par le robot':''}</div></td><td class="v">${v}</td><td>${badge(f.statut)}</td></tr>`;}).join('')}</tbody></table>`;
for(const r of V.rubriques){const L=V.faits.filter(f=>f.rubrique===r);if(!L.length)continue;const id=slug(r);sec.push([id,r]);
  h+=`<h2 id="${id}">${esc(r)}</h2>`;
  if(r==='Session '+S&&!V.tableau_publie[S])h+=`<p>L'OFSP n'a pas encore publié le Tableau des délais ${S}. Le délai d'inscription tombe probablement le 31 mars ${S}, selon la règle constante : la page le marque comme déduction tant que le tableau officiel manque.</p>`;
  h+=lignes(L);}
// sources
sec.push(['sources','Sources et fraîcheur']);
h+=`<h2 id="sources">Sources et fraîcheur</h2><p>Le robot télécharge une source seulement quand elle change (requête conditionnelle) ; un refus du serveur reste noté tel quel, sans contournement.</p>
<table><thead><tr><th>Source</th><th>Lu le</th><th>Réponse</th><th>Empreinte</th></tr></thead><tbody>${V.sources.map(s=>`<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titre||s.cle)}</a></td><td>${esc(s.consulte_le||'—')}</td><td>${s.statut_http===200||s.statut_http===304?'lue':s.statut_http?'refus '+s.statut_http:'non lue'}</td><td><span data-i="${esc(s.sha256||'')}">${s.sha256?s.sha256.slice(0,10):'—'}</span></td></tr>`).join('')}</tbody></table>`;
// préparation
sec.push(['preparation','Ma préparation']);
h+=`<h2 id="preparation">Ma préparation</h2><p>Le tableau lit les réponses que tu as jouées dans les arènes de ce navigateur ; il ne montre jamais une question que tu n'as pas encore jouée.</p><div id="suivi"></div>`;
// liens
sec.push(['liens','Liens officiels']);
h+=`<h2 id="liens">Liens officiels</h2><ul class="liens">${V.liens.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.titre)}</a></li>`).join('')}</ul>
<p class="auto" style="margin-top:30px">Généré le ${esc(V.genere_le)} par ${esc(V.genere_par)}. Signature : ${esc(V.signature)}</p>`;
$('#page').innerHTML=h;
$('#sommaire').innerHTML=sec.map(([id,t])=>`<li><a href="#${id}">${esc(t)}</a></li>`).join('');
$('#maj').textContent='Mise à jour du '+new Date(V.genere_le+'T12:00:00').toLocaleDateString('fr-CH');
try{window.Suivi&&Suivi.monter($('#suivi'));}catch(e){$('#suivi').textContent='Le suivi ne se charge pas dans ce navigateur.';}
// infobulles
const b=$('#bulle');
document.addEventListener('mouseover',e=>{const t=e.target.closest('#page [data-i]');if(!t||!t.dataset.i)return;const r=t.getBoundingClientRect();b.textContent=t.dataset.i;b.style.display='block';b.style.left=Math.max(8,Math.min(r.left,innerWidth-350))+'px';b.style.top=(r.bottom+6)+'px';});
document.addEventListener('mouseout',e=>{if(e.target.closest('#page [data-i]'))b.style.display='none';});
// sommaire actif
const liens=[...document.querySelectorAll('#sommaire a')];
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)liens.forEach(a=>a.classList.toggle('cur',a.hash==='#'+x.target.id));}),{rootMargin:'0px 0px -70% 0px'});sec.forEach(([id])=>{const el=document.getElementById(id);if(el)io.observe(el);});
document.documentElement.dataset.pret='1';
})();
</script>
</body></html>

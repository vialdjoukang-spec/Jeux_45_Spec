<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arène commune</title>
<style>
/* Moteur d'arène commun aux 4 jeux : duel chronométré, formats A, Kprim et « économe », correction en 7 marches, boîtes de Leitner. AAI (Anthropic AI) */
@font-face{font-family:A;src:url(atk400.woff2) format("woff2");font-weight:400}
@font-face{font-family:A;src:url(atk700.woff2) format("woff2");font-weight:700}
:root{color-scheme:light;--bg:#e3f2fd;--carte:#fff;--ink:#1d2230;--sous:#5b6275;--trait:#a9bccd;--ok:#1f8a4c;--ko:#c0392b;--acc:#2f6fd0}
*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 A,sans-serif}
nav{position:fixed;inset:0 auto 0 0;width:240px;padding:22px 14px;border-right:1px solid var(--trait);overflow:auto}
nav h2{font:700 15px Georgia,serif;margin:0 0 10px}nav select{width:100%;font:14px A;padding:8px;border-radius:6px;border:1px solid var(--trait);background:var(--carte);color:var(--ink);margin-bottom:12px}
nav ol{margin:0;padding:0;list-style:none}nav li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}nav li:hover,nav li.cur{background:var(--carte)}
nav li b{min-width:20px;color:var(--sous)}nav li i{margin-left:auto;font-style:normal;font-size:11px;color:var(--sous)}
main{margin-left:240px;padding:28px 20px 80px}.col{max-width:1180px;margin:auto}
h1{font:700 22px Georgia,serif;margin:0 0 4px}.sous{color:var(--sous);font-size:13px}
.barre{display:flex;gap:18px;align-items:center;margin:14px 0;font-size:13.5px}.chrono{font-weight:700;font-variant-numeric:tabular-nums}
.chrono.rouge{color:var(--ko)}.stem{background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:14px 16px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:10px 12px;margin:7px 0;cursor:pointer}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.opt .k{font-weight:700;min-width:22px}
.opt.bon{border-color:var(--ok)}.opt.faux{border-color:var(--ko)}.opt .why{display:none;font-size:13.5px;color:var(--sous);margin-top:4px}.fini .opt .why{display:block}
.vf{display:flex;gap:6px;margin-left:auto}.vf button{font:700 12px A;padding:4px 10px;border-radius:99px;border:1px solid var(--trait);background:transparent;color:var(--ink);cursor:pointer}.vf button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.act{margin:14px 0;display:flex;gap:10px}.act button{font:700 14px A;padding:10px 18px;border-radius:99px;border:0;background:var(--acc);color:#fff;cursor:pointer;min-height:44px}.act button.sec{background:transparent;color:var(--ink);border:1px solid var(--trait)}
.res{font-weight:700;font-size:16px;margin:8px 0}.res.ok{color:var(--ok)}.res.ko{color:var(--ko)}
.echelle{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;background:var(--carte);border-radius:8px;padding:12px 14px;border:1px solid var(--trait);font-size:14px}
.echelle dt{font-weight:700;color:var(--acc)}.echelle dd{margin:0}.src{font-size:12px;color:var(--sous);margin-top:8px}
.maitrise{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px}.maitrise span{width:18px;height:18px;border-radius:4px;background:var(--trait)}
@media(max-width:760px){nav{position:static;width:auto;border:0}main{margin:0;padding:12px}.echelle{grid-template-columns:1fr}}

:root[data-fond=blanc]{--bg:#ffffff;--trait:#e5e7eb}:root[data-fond=vert]{--bg:#e8f5e9;--trait:#d3e6d5}:root[data-fond=or]{--bg:#fbf3d9;--trait:#ece0b8}:root[data-fond=champagne]{--bg:#f7ecdc;--trait:#e8d9c2}
.fonds{display:flex;gap:6px;margin:12px 0 4px}.fonds button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--trait);cursor:pointer}
.correction{display:none;margin-top:14px}.fini .correction{display:block}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.bloc{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:12px 14px}
.bloc h3{font:700 15px Georgia,serif;margin:0 0 8px}.bloc .echelle{border:0;padding:0;grid-template-columns:118px 1fr;font-size:14px}
.theme{font-weight:700;color:var(--acc);margin-bottom:6px}.notion{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--trait);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.notion:hover{border-color:var(--acc)}.notion b{display:block;font-size:14px}.notion span{font-size:13px;color:var(--sous)}.notion.autre{opacity:.75}
.ssp{margin-top:14px}.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#1f8a4c;color:#fff;margin-left:6px}.badge.add{background:#b45309}
.algo{overflow-x:auto;padding:8px 0}.arbre,.arbre ul{list-style:none;margin:0;padding:0;display:flex;align-items:center}
.arbre li{display:flex;align-items:center;position:relative}.arbre ul{flex-direction:column;align-items:flex-start;padding-left:26px;position:relative}
.arbre ul>li{padding:4px 0 4px 16px}.arbre ul>li::before{content:"";position:absolute;left:0;top:50%;width:16px;border-top:2px solid var(--acc)}
.arbre ul>li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--acc)}.arbre ul>li:first-child::after{top:50%}.arbre ul>li:last-child::after{bottom:50%}.arbre ul>li:only-child::after{display:none}
.arbre ul::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:2px solid var(--acc)}
.noeud{background:var(--carte);border:1px solid var(--acc);border-radius:8px;padding:6px 10px;font-size:13px;max-width:210px;cursor:pointer;white-space:normal}.noeud.ferme::after{content:" +";color:var(--acc);font-weight:700}.noeud.feuille{border-style:dashed;cursor:default}
.fenetre{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.fenetre.ouverte{display:flex}
.fenetre>div{background:var(--carte);border-radius:12px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}.fenetre h3{font:700 18px Georgia,serif;margin:0 0 6px}
.fenetre table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}.fenetre td,.fenetre th{border-bottom:1px solid var(--trait);padding:6px 8px;text-align:left;vertical-align:top}.fenetre th{color:var(--sous);font-size:12.5px}
.fenetre li{margin:4px 0}.fermer{float:right;font:700 13px A;border:1px solid var(--trait);background:transparent;border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--ink)}
@media(max-width:760px){.deux{grid-template-columns:1fr}}

.arbre ul[hidden]{display:none!important}
.liensv{margin:0 0 10px;font-size:13px}.liensv a{color:var(--acc);font-weight:700}.arbre ul>li::before,.arbre ul>li::after,.arbre ul::before{border-color:#1d4ed8!important;border-width:2.5px!important}
.noeud{border:1.5px solid #1d4ed8;color:#0f172a}.noeud.racine{background:#fde8ea;border-color:#c8102e;color:#9b0d23;font-weight:700}.noeud.feuille{border:1.5px dashed #64748b;cursor:default}
.noeud.pec{min-width:200px;border:1.5px solid #c8102e;background:#fff5f5;cursor:pointer}.noeud.pec::after{content:" ▸ prise en charge";color:#c8102e;font-weight:700;font-size:12px}
.fenetre table td,.fenetre table th{border:1px solid #a9bccd}.fenetre th{background:#f3f6f9;font-weight:700}
.cl{font-weight:700;font-style:italic}.sc{font-weight:700}.mol{font-weight:400}
.hi{display:block;margin:3px 0;cursor:help;text-decoration:underline dotted 1.5px;text-underline-offset:3px}.hi::before{content:'• '}.hi:hover,.hi:focus{color:#1d4ed8}
#bulle{position:fixed;z-index:70;max-width:340px;background:#0f172a;color:#fff;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.pecw h4{font:700 15px Georgia,serif;margin:14px 0 4px}.pecw .ok{font-weight:700;font-style:italic}

abbr.ab{text-decoration:underline dotted 1px;text-underline-offset:2px;cursor:help}
.vf{flex:0 0 auto;gap:6px}.vf button{white-space:nowrap;min-width:52px}
@media(max-width:600px){.opt{flex-wrap:wrap}.vf{margin-left:30px;width:100%}}
.noeud.lien{cursor:pointer}.noeud.lien::after{content:" ▸ notion";color:#1d4ed8;font-weight:700;font-size:12px}

.opt.bon{border:3px solid #15803d!important;background:#ecfdf3}.opt.faux{border:3px solid #dc2626!important;background:#fef2f2}
.opt.bon .k{color:#15803d}.opt.faux .k{color:#dc2626}
[hidden]{display:none!important}
</style></head><body>
<nav><h2>Arène commune</h2><p class="liensv"><a href="../veille/index.html">Veille Examen fédéral</a> · <a href="#" onclick="window.Suivi&&Suivi.ouvrir();return false">Ma préparation</a></p><select id="paquet"></select><ol id="liste"></ol><div class="maitrise" id="maitrise" title="Boîtes de Leitner : 0 à 4"></div><div class="fonds" id="fonds" title="Fond de page"></div></nav>
<main><div class="col">
<h1 id="titre">Chargement…</h1><div class="sous" id="ss"></div>
<div class="barre"><span>Score : <b id="score">0</b></span><span class="chrono" id="chrono">—</span><span id="format" class="sous"></span></div>
<div class="stem" id="stem"></div><div id="prompt" style="font-weight:700"></div>
<div id="opts"></div>
<div class="act"><button id="valider">Valider</button><button id="suivant" class="sec">Question suivante</button></div>
<div id="res"></div><dl class="echelle" id="echelle" hidden></dl><div class="correction" id="correction"></div><div class="src" id="src"></div>
</div></main><div id="bulle" role="tooltip"></div><div class="fenetre" id="fenetre" role="dialog" aria-modal="true"><div id="fenetreCorps"></div></div>
<script>
{
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.hash.slice(1));
const NOMS={zeroD:"Zéro diagnostic",mechanism:"Mécanisme",semiology:"Sémiologie",discriminant:"Discriminant",decision:"Décision",trap:"Piège",anchor:"Ancre"};
const FMT={A:"Une seule bonne réponse",Kprim:"Vrai ou faux pour chaque affirmation (Kprim)",Econome:"Coche seulement les examens nécessaires : chaque examen inutile coûte un point"};
const TEMPS={A:90,Kprim:120,Econome:120};
let P=null,i=0,score=0,choix={},fini=false,t0=0,tick=null,boites={};
const lire=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}},ecrire=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let SIG={},RX=null;
fetch('arenes/sigles.json').then(r=>r.json()).then(g=>{SIG=g;const k=Object.keys(g).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));RX=new RegExp('(^|[^\\wÀ-ÿ])('+k.join('|')+')(?![\\wÀ-ÿ])','g');}).catch(()=>{});
const sig=h=>RX?h.replace(RX,(m,a,b)=>`${a}<abbr class="ab" data-i="${esc(b+' : '+SIG[b])}">${b}</abbr>`):h;
const T=x=>sig(esc(x));
async function charger(p){P=await (await fetch('arenes/'+p+'.json')).json();boites=lire('arene_'+p);score=0;$('score').textContent=0;
 $('liste').innerHTML=P.questions.map((q,j)=>`<li data-j="${j}"><b>${j+1}</b>Question ${j+1}<i>${boites[q.id]??0}</i></li>`).join('');
 $('liste').onclick=e=>{const li=e.target.closest('li');if(li)montrer(+li.dataset.j);};
 // répétition espacée : on commence par la question de la plus petite boîte
 montrer(P.questions.map((q,j)=>[boites[q.id]??0,j]).sort((a,b)=>a[0]-b[0])[0][1]);}
function montrer(j){i=j;const q=P.questions[j];choix={};fini=false;document.body.classList.remove('fini');
 document.querySelectorAll('#liste li').forEach(l=>l.classList.toggle('cur',+l.dataset.j===j));
 $('titre').textContent='Question '+(j+1);$('ss').textContent=P.nom+' · question '+(j+1)+' / '+P.questions.length;$('format').textContent=FMT[q.format]||'';
 $('stem').textContent=q.stem;$('prompt').textContent=q.prompt;$('res').innerHTML='';$('echelle').hidden=true;$('correction').innerHTML='';$('src').textContent='';
 $('opts').innerHTML=q.options.map(o=>`<div class="opt" data-k="${esc(o.k)}"><span class="k">${esc(o.k)}</span><div><div>${esc(o.t)}</div><div class="why">${T(o.why)}</div></div>${q.format==='Kprim'?'<span class="vf"><button data-v="1">Vrai</button><button data-v="0">Faux</button></span>':''}</div>`).join('');
 $('opts').onclick=e=>{if(fini)return;const d=e.target.closest('.opt');if(!d)return;const k=d.dataset.k;
  if(q.format==='Kprim'){const b=e.target.closest('button');if(!b)return;choix[k]=b.dataset.v==='1';d.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(q.format==='A'){choix={[k]:true};document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===d));}
  else{choix[k]=!choix[k];d.classList.toggle('sel',!!choix[k]);}};
 clearInterval(tick);t0=Date.now();const TT=TEMPS[q.format]||90;
 tick=setInterval(()=>{const r=Math.max(0,TT-Math.round((Date.now()-t0)/1000));$('chrono').textContent='⏱ '+r+' s';$('chrono').classList.toggle('rouge',r<=15);if(!r)valider();},250);}
function valider(){if(fini)return;fini=true;clearInterval(tick);const q=P.questions[i];$('titre').textContent=q.titre;document.body.classList.add('fini');let pts=0,max=1,juste=false;
 q.options.forEach(o=>{const d=document.querySelector(`.opt[data-k="${CSS.escape(o.k)}"]`);
  const pris=q.format==='Kprim'?choix[o.k]===o.ok:!!choix[o.k];const c=q.format==='Kprim'?(pris?'bon':'faux'):(o.ok?'bon':(choix[o.k]?'faux':''));if(c)d.classList.add(c);});
 if(q.format==='A'){juste=q.options.some(o=>o.ok&&choix[o.k]);pts=juste?1:0;}
 else if(q.format==='Kprim'){const n=q.options.filter(o=>choix[o.k]===o.ok).length;pts=n===4?1:n===3?.5:0;juste=n===q.options.length;}
 else{const bons=q.options.filter(o=>o.ok),inut=q.options.filter(o=>!o.ok&&choix[o.k]).length,manq=bons.filter(o=>!choix[o.k]).length;max=bons.length;pts=Math.max(0,bons.length-manq-inut);juste=!manq&&!inut;
  $('res').innerHTML=`<div class="sous">${manq} examen(s) nécessaire(s) manqué(s) · ${inut} examen(s) inutile(s) demandé(s)</div>`;}
 score+=pts;$('score').textContent=String(score).replace('.',',');
 $('res').insertAdjacentHTML('afterbegin',`<div class="res ${juste?'ok':'ko'}">${juste?'Juste':'À revoir'} : ${String(pts).replace('.',',')}/${max}</div>`);
 boites[q.id]=juste?Math.min(4,(boites[q.id]??0)+1):0;ecrire('arene_'+Q.get('paquet'),boites);
 try{const pq=Q.get('paquet')||'',pre=pq.split('_')[0],JEUX={'45spec':'45 Spec',paraclinique:'Paraclinique',transversal:'Transversal',tetrade:'Tétrade'},ss=(q.correction&&q.correction.ssp)||q.ssp;
  window.Suivi&&Suivi.enregistrer({jeu:JEUX[pre]||pre,specialite:pre==='45spec'?pq.slice(7):(JEUX[pre]||pre)+' · '+pq.split('_').slice(1).join(' '),ssp:ss?(ss.code?ss.code+' '+(ss.nom||''):ss).trim():'',notion:q.titre,format:q.format,juste,points:pts,max,temps:(Date.now()-t0)/1000,qid:pq+'/'+q.id});}catch(e){}
 document.querySelector(`#liste li[data-j="${i}"] i`).textContent=boites[q.id];maitrise();
 const ech=(q.echelle||[]).map(([m,t])=>`<dt>${NOMS[m]||m}</dt><dd>${T(t)}</dd>`).join('');
 if(q.correction){const c=q.correction,nb=(n,i,cl)=>`<button class="notion ${cl||''}" data-n="${n.id}"><b>${i}. ${esc(n.titre)}</b><span>${T(n.comment)}</span></button>`;
  $('correction').innerHTML=`<div class="deux"><div class="bloc"><h3>A · Le contexte expliqué</h3><dl class="echelle">${ech}</dl></div>
  <div class="bloc"><h3>B · Notions abordées</h3><div class="theme">Thème : ${esc(c.theme)}</div>${c.notions.map((n,i)=>nb(n,i+1)).join('')}
  ${c.autres&&c.autres.length?`<details><summary class="sous">Autres notions de la pathologie (${c.autres.length})</summary>${c.autres.map((n,i)=>nb(n,c.notions.length+i+1,'autre')).join('')}</details>`:''}</div></div>
  <div class="bloc ssp"><h3>C · Situation de départ : SSP ${esc(c.ssp.code)} « ${esc(c.ssp.nom)} »<span class="badge ${c.ssp.officiel?'':'add'}">${c.ssp.officiel?'SSP officiel PROFILES':'SSP additionnel'}</span></h3>
  <div class="sous">Algorithme décisionnel : clique une case pour déplier la suite.</div><div class="algo"><ul class="arbre">${arbre(c.ssp.algorithme,0)}</ul></div></div>`;
  NOT={};[...c.notions,...(c.autres||[])].forEach(n=>NOT[n.id]=n);PEC=c.pec||{};}
 else if(ech){$('echelle').innerHTML=ech;$('echelle').hidden=false;}
 $('src').textContent=q.sources&&q.sources.length?'Sources : '+[].concat(q.sources).map(s=>typeof s==='string'?s:(s.titre||s.title||JSON.stringify(s))).join(' ; '):'';}
let NOT={};
function arbre(n,p){const e=n.e||[],id='a'+Math.random().toString(36).slice(2,8),ouvert=p<1;
 const cl=p===0?'racine':e.length?(ouvert?'':'ferme'):(n.pec?'pec':(n.notion?'feuille lien':'feuille'));
 return `<li><span class="noeud ${cl}" ${e.length?`data-a="${id}"`:''} ${n.pec?`data-pec="${n.pec}"`:''} ${n.i?`data-i="${esc(n.i)}"`:''} ${n.notion?`data-notion="${n.notion}"`:''}>${T(n.t)}${n.i?' <small>ⓘ</small>':''}</span>${e.length?`<ul ${ouvert?'':'hidden'} id="${id}">${e.map(x=>arbre(x,p+1)).join('')}</ul>`:''}</li>`;}
const cel=(x,k,j)=>Array.isArray(x)?x.map(o=>`<span class="hi ${j>=3&&k.length>4?(j===3?'d':'p'):(j===1?'d':'p')}" data-i="${esc(o.i)}" tabindex="0">${esc(o.t)}</span>`).join(' '):(x&&x.t?`<span class="hi d" data-i="${esc(x.i)}">${esc(x.t)}</span>`:T(x));
function tableau(t){const L=t.lignes;let h=`<table><thead><tr>${t.colonnes.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
 L.forEach((l,r)=>{h+='<tr>';l.forEach((x,j)=>{if(j===0&&typeof x==='string'){if(r>0&&L[r-1][0]===x)return;let n=1;while(L[r+n]&&L[r+n][0]===x)n++;h+=`<td rowspan="${n}" class="cl">${esc(x)}</td>`;return;}
  const c=j===1&&t.colonnes.length>4?'sc':(j===2&&t.colonnes.length>4?'mol':'');h+=`<td class="${c}">${cel(x,t.colonnes,j)}</td>`;});h+='</tr>';});return h+'</tbody></table>';}
function pecHtml(P){const esc=T;const L=(a,f)=>(a||[]).map(f).join('');const v=c=>c?`<ul>${L(c.mesuresGenerales,x=>`<li>${esc(x)}</li>`)}</ul><ol class="etape">${L(c.etapes,e=>`<li><b>${esc(e.temps)}</b> · <span class="cl">${esc(e.qui)}</span> : ${esc(e.fait)}</li>`)}</ol>`:'';
 return `<div class="pecw"><h3>${esc(P.titre)}</h3><h4>But</h4><ul>${L(P.but,x=>`<li>${esc(x)}</li>`)}</ul>
 <h4>Moyens</h4><p class="ok">Mesures générales à l'accueil</p><ul>${L(P.moyens.accueil,x=>`<li>${esc(x)}</li>`)}</ul>
 ${P.moyens.pharmacologique.length?`<p class="ok">Pharmacologique</p><table><thead><tr><th>Molécule</th><th>Posologie</th><th>Pourquoi</th></tr></thead><tbody>${L(P.moyens.pharmacologique,m=>`<tr><td class="mol">${esc(m.molecule)}</td><td>${esc(m.posologie)}</td><td>${esc(m.pourquoi)}<div class="src">${esc(m.source)}</div></td></tr>`)}</tbody></table>`:''}
 <p class="ok">Non pharmacologique</p><ul>${L(P.moyens.nonPharmacologique,x=>`<li><span class="cl">${esc(x.categorie)}</span> : ${esc(x.mesure)}</li>`)}${L(P.moyens.transversal,x=>`<li><span class="cl">${esc(x.discipline)}</span> : ${esc(x.apport)}</li>`)}</ul>
 <h4>Conduite en équipe</h4><table><thead><tr><th>Situation d'urgence</th><th>Hors urgence</th></tr></thead><tbody><tr><td>${v(P.conduite.urgence)||'Sans objet'}</td><td>${v(P.conduite.horsUrgence)||'Sans objet'}</td></tr></tbody></table>
 ${P.cibles?`<h4>Cibles selon la forme</h4>${tableau(P.cibles)}`:''}
 <h4>Pronostic</h4><p>${esc(P.pronostic)}</p><h4>Surveillance</h4><table><thead><tr><th>Quoi</th><th>Quand</th><th>Cible</th></tr></thead><tbody>${L(P.surveillance.suivi,x=>`<tr><td class="mol">${esc(x.quoi)}</td><td>${esc(x.quand)}</td><td>${esc(x.cible)}</td></tr>`)}</tbody></table>
 <p><span class="cl">Sortie</span> : ${esc(P.surveillance.sortie)}</p><h4>Prévention</h4><ul>${['primaire','secondaire','tertiaire'].filter(k=>P.prevention[k]).map(k=>`<li><span class="cl">${k}</span> : ${esc(P.prevention[k])}</li>`).join('')}</ul></div>`;}
let PEC={};
function fenetre(n){const c=n.cours||{},t=c.tableau;$('fenetreCorps').innerHTML=`<button class="fermer" id="fermer">Fermer</button><h3>${esc(n.titre)}</h3><p>${T(n.comment)}</p>
 ${t?tableau(t):''}${c.arbre?`<p class="sous">Clique une case pour déplier ; survole ou touche-la pour lire le pourquoi.</p><div class="algo"><ul class="arbre">${arbre(c.arbre,0)}</ul></div>`:''}
 ${c.points?`<ul>${c.points.map(x=>`<li>${T(x)}</li>`).join('')}</ul>`:''}<p class="src">Sources : ${esc((n.sources||[]).join(' ; '))}</p>`;$('fenetre').classList.add('ouverte');$('fermer').onclick=()=>$('fenetre').classList.remove('ouverte');}
document.addEventListener('click',e=>{const b=e.target.closest('.notion');if(b&&NOT[b.dataset.n])fenetre(NOT[b.dataset.n]);
 const pz=e.target.closest('.noeud.pec');if(pz&&PEC[pz.dataset.pec]){$('fenetreCorps').innerHTML='<button class="fermer" id="fermer">Fermer</button>'+pecHtml(PEC[pz.dataset.pec]);$('fenetre').classList.add('ouverte');$('fermer').onclick=()=>$('fenetre').classList.remove('ouverte');}
 const ln=e.target.closest('.noeud[data-notion]');if(ln&&NOT[ln.dataset.notion]){fenetre(NOT[ln.dataset.notion]);return;}
 const hi=e.target.closest('[data-i]');if(hi){montrerBulle(hi);if(hi.classList.contains('hi'))return;}else $('bulle').style.display='none';
 const a=e.target.closest('.noeud');if(a&&a.dataset.a){const u=document.getElementById(a.dataset.a);if(u){u.hidden=!u.hidden;a.classList.toggle('ferme',u.hidden);}}
 if(e.target.id==='fenetre')$('fenetre').classList.remove('ouverte');});
function montrerBulle(el){const b=$('bulle');b.textContent=el.dataset.i;b.style.display='block';const r=el.getBoundingClientRect();
 let x=Math.min(r.left,innerWidth-350),y=r.bottom+8;if(y+b.offsetHeight>innerHeight)y=r.top-b.offsetHeight-8;b.style.left=Math.max(8,x)+'px';b.style.top=Math.max(8,y)+'px';}
document.addEventListener('mouseover',e=>{const hi=e.target.closest('[data-i]');if(hi)montrerBulle(hi);});document.addEventListener('mouseout',e=>{if(e.target.closest('[data-i]'))$('bulle').style.display='none';});
const FONDS=[['ciel','#e3f2fd','Bleu ciel'],['blanc','#ffffff','Blanc'],['vert','#e8f5e9','Vert pâle'],['or','#fbf3d9','Or pâle'],['champagne','#f7ecdc','Champagne']];
const fond=f=>{document.documentElement.dataset.fond=f;try{localStorage.setItem('fond',f)}catch(e){}};
$('fonds').innerHTML=FONDS.map(([k,c,l])=>`<button style="background:${c}" title="${l}" data-f="${k}"></button>`).join('');$('fonds').onclick=e=>{const b=e.target.closest('button');if(b)fond(b.dataset.f);};
try{fond(localStorage.getItem('fond')||'ciel')}catch(e){fond('ciel')}
function maitrise(){$('maitrise').innerHTML=P.questions.map(q=>{const b=boites[q.id]??0;return `<span style="background:${b?`color-mix(in srgb,var(--ok) ${b*25}%,var(--trait))`:''}"></span>`}).join('');}
$('valider').onclick=valider;$('suivant').onclick=()=>{const L=P.questions.map((q,j)=>[boites[q.id]??0,(j-i+P.questions.length)%P.questions.length||99,j]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);montrer(L[0][2]===i&&L[1]?L[1][2]:L[0][2]);};
(async()=>{const idx=await (await fetch('arenes/index.json')).json();$('paquet').innerHTML=idx.map(x=>`<option value="${x.paquet}">${esc(x.nom)} (${x.n})</option>`).join('');
 const p=Q.get('paquet')||idx[0].paquet;$('paquet').value=p;Q.set('paquet',p);$('paquet').onchange=e=>{Q.set('paquet',e.target.value);history.replaceState(null,'','#'+Q);charger(e.target.value);};
 await charger(p);maitrise();if(Q.has('valider'))setTimeout(()=>{document.querySelector('.opt')?.click();valider();},100);document.title='PRET';})();
}

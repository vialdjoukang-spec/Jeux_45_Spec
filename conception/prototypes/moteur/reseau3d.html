const span=n=>{const ks=fils(n);if(!ks.length)return n.h;let t=0;ks.forEach((k,i)=>{t+=span(k)+(i?gapEntre(ks[i-1],k):0);});return Math.max(n.h,t);};
const poser=(n,cy,acc)=>{n.y=cy;acc&&acc.push(n);const ks=fils(n);if(!ks.length)return;let tot=0;ks.forEach((k,i)=>{tot+=span(k)+(i?gapEntre(ks[i-1],k):0);});let y=cy-tot/2;ks.forEach((k,i)=>{if(i)y+=gapEntre(ks[i-1],k);poser(k,y+span(k)/2,acc);y+=span(k);});};
const recaler=arbre=>{const t=Math.min(...arbre.map(m=>m.y-m.h/2)),bt=Math.max(...arbre.map(m=>m.y+m.h/2));const d=(bt-t>bas-haut)?haut-t:(t<haut?haut-t:(bt>bas?bas-bt:0));if(d)arbre.forEach(m=>m.y+=d);};
/* racines : à hauteur de leur organe ; poussées seulement si deux racines d'une même colonne se gênent */
const racines=N.filter(n=>!n.de.length);
for(const cote of['g','d']){const rs=racines.filter(r=>r.cote===cote).sort((a,b)=>(a.y0??a.o?.[1]??0)-(b.y0??b.o?.[1]??0));
 let bas0=-1e9;for(const r of rs){const cy=Math.max(r.y0??r.o?.[1]??H/2,bas0+GF+r.h/2);const arbre=[];poser(r,cy,arbre);recaler(arbre);bas0=Math.max(...arbre.filter(m=>m._c===0).map(m=>m.y+m.h/2));}}
/* entités convergentes : à la hauteur moyenne de leurs parents, puis leur propre arbre */
for(const n of N.filter(n=>n.de.length>1&&visible(n)).sort((a,b)=>a._p-b._p)){const ps=n.de.map(p=>byId[p]).filter(p=>ouvert.has(p.id)&&visible(p));const arbre=[];poser(n,n.y0??ps.reduce((s,p)=>s+p.y,0)/ps.length,arbre);recaler(arbre);}
N.forEach(n=>{if(n.y0&&n.de.length===1&&!fils(n).length)n.y=n.y0;});
N.forEach(n=>{if(n.de.length)n.y+=oy;n.el.style.left=(n.x-n.w/2)+'px';n.el.style.top=n.y+'px';});
}
function dessiner(){disposer();x.clearRect(0,0,W,H);const trait=getComputedStyle(document.documentElement).getPropertyValue('--trait').trim();
 for(const n of N){n.el.classList.toggle('cache',!visible(n));n.el.classList.toggle('ouvert',ouvert.has(n.id));}
 for(const f of C.fenetres||[]){const p=byId[f.de];f.el.classList.toggle('cache',!(ouvert.has(p.id)&&visible(p)));}
 const vis=n=>visible(n);const actifs=n=>n.de.filter(p=>ouvert.has(p)&&vis(byId[p]));
 /* 1. départ depuis l'organe : horizontale jusqu'au bord du corps, puis horizontale/oblique vers la case */
 for(const n of N){if(!n.organe||!vis(n))continue;const col=n.couleur||trait,d=n.cote==='d'?1:-1,bc=d>0?Rr:L,e=[bordX(n,d<0),n.y];
  seg([n.o,[bc,n.o[1]],e],col,2.2);pointe(e,d,col);x.fillStyle=col;x.beginPath();x.arc(...n.o,5,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();}
 /* 2. éventail : parent → horizontale → verticale qui groupe ses enfants (à parent unique) */
 for(const P of N){if(!ouvert.has(P.id)||!vis(P))continue;const K=P.enf.map(i=>byId[i]).filter(n=>vis(n)&&actifs(n).length===1);if(!K.length)continue;
  const d=K[0].cote==='d'?1:-1,col=P.couleur||trait,x0=bordX(P,d>0),xb=x0+d*G*0.32;
  const ys=K.map(k=>k.y).concat([P.y]);seg([[x0,P.y],[xb,P.y]],col,2.2);
  if(K.length>1||Math.abs(K[0].y-P.y)>1)seg([[xb,Math.min(...ys)],[xb,Math.max(...ys)]],col,2.2);
  noeudRond([xb,P.y],col);for(const k of K){const e=[bordX(k,d<0),k.y];seg([[xb,k.y],e],col,2);pointe(e,d,col);}}
 /* 3. convergence : plusieurs parents → verticale qui les regroupe → horizontale vers l'entité */
 for(const n of N){if(!vis(n))continue;const Ps=actifs(n).map(i=>byId[i]);if(Ps.length<2)continue;
  const d=n.cote==='d'?1:-1,col=n.couleur||trait,e=[bordX(n,d<0),n.y],xb=e[0]-d*G*0.3;
  for(const P of Ps)seg([[bordX(P,d>0),P.y],[xb,P.y]],P.couleur||trait,2);
  const ys=Ps.map(p=>p.y).concat([n.y]);seg([[xb,Math.min(...ys)],[xb,Math.max(...ys)]],col,2.2);noeudRond([xb,n.y],col);seg([[xb,n.y],e],col,2.2);pointe(e,d,col);}
 /* 4. fenêtre de clichés : verticale depuis la case parente */
 for(const f of C.fenetres||[]){const p=byId[f.de];if(!(ouvert.has(p.id)&&vis(p)))continue;const col=p.couleur||trait;
  if(p.y<f.y){const xs=Math.min(Math.max(p.x,f.x+24),f.x+f.w-24);seg([[xs,p.y+p.h/2],[xs,f.y]],col,2.2);x.fillStyle=col;x.beginPath();x.moveTo(xs,f.y);x.lineTo(xs-5,f.y-9);x.lineTo(xs+5,f.y-9);x.fill();}
  else{seg([[bordX(p,true),p.y],[f.x,p.y]],col,2.2);pointe([f.x,p.y],1,col);}}}
if(Q.get('ouvrir'))Q.get('ouvrir').split(',').forEach(i=>ouvert.add(i));
if(Q.has('tout'))for(const n of N)if((n.enf.length||n.aFen)&&!(Q.get('sauf')||'').split(',').includes(n.id))ouvert.add(n.id);

/* ---------- infobulle symétrique : 4 rubriques fixes, une phrase verbale chacune ---------- */
const RUBS=Object.assign({semiologie:[['def','Ce que c\'est'],['pourquoi','Pourquoi ici'],['confusion','Confusion possible'],['retenir','À retenir']]},C.rubriques||{});
let audio=null;const jouer=src=>{try{if(audio)audio.pause();audio=new Audio(src);audio.play();}catch(e){}};
const GLO=C.glossaire||{};const GK=Object.keys(GLO).sort((a,b)=>b.length-a.length);
const GRE=GK.length?new RegExp('(^|[^\\wÀ-ÿ\\-])('+GK.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\wÀ-ÿ])','g'):null;
const esc=t=>t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const gloser=h=>GRE?h.split(/(<[^>]+>)/).map(part=>part.startsWith('<')?part:part.replace(GRE,(m,a,b)=>a+'<span class=terme data-def="'+esc(GLO[b])+'">'+b+'</span>')).join(''):h;
const VIS=[['diagnostique','Diagnostique'],['retentissement','Extension et retentissement'],['etiologique','Étiologique'],['complications','Suivi des complications'],['therapeutique','Thérapeutique'],['sortie','Sortie']];
let lentille=Q.get('lentille')||'';const LEN=C.lentilles||[];
function montrer(n){if(!n.bulle||n.el.classList.contains('cache'))return;bulle.style.setProperty('--c',n.couleur||'#888');const B=n.bulle;
 const pl=lentille&&n.particularites&&n.particularites[lentille];const ln=LEN.find(l=>l.id===lentille);
 const RUB=RUBS[n.espace]||RUBS[n.rubriques]||RUBS.semiologie;const rub='<h4>'+n.texte+'</h4><dl>'+RUB.filter(([k])=>B[k]!==undefined).map(([k,l])=>'<dt>'+l+'</dt><dd>'+(B[k]||'Aucune confusion fréquente.')+'</dd>').join('')
  +(pl?'<dt style="color:'+ln.couleur+'">Particularité · '+ln.nom+'</dt><dd style="border-left:3px solid '+ln.couleur+';padding-left:6px">'+pl+'</dd>':'')+'</dl>';
 const sup=x=>'<span class=terme data-def="'+esc(x[1])+'">'+x[0]+'</span>';
 const bil=B.bilan?'<h5 class=sec>Bilan</h5>'+VIS.filter(([k])=>B.bilan[k]).map(([k,l])=>'<div class=vis><b>'+l+'</b>'+Object.entries(B.bilan[k]).map(([g,xs])=>'<div class=grp>› '+g+' : '+xs.map(sup).join(', ')+'</div>').join('')+'</div>').join(''):'';
 const trt=B.traitement?'<h5 class=sec>Traitement</h5><div class=grp>'+B.traitement.map(t=>sup(t)).join('<br>')+'</div>'+(B.source?'<div class=src>Source : '+B.source+'</div>':''):'';
 bulle.innerHTML=gloser(rub)+bil+trt+(n.son?'<button class=ecoute>▶ Écouter : '+(n.sonTitre||n.texte)+'</button>':'');
 bulle.style.width=(B.bilan?430:340)+'px';bulle.style.display='block';const bw=B.bilan?400:330,bh=bulle.offsetHeight;let bx=n.cote==='d'?n.x-n.w/2-bw-14:n.x+n.w/2+14;if(bx<8)bx=n.x+n.w/2+14;if(bx+bw>W-8)bx=n.x-n.w/2-bw-14;
 bulle.style.left=bx+'px';bulle.style.top=Math.min(Math.max(n.y-bh/2,90),H-bh-8)+'px';const b=bulle.querySelector('.ecoute');if(b)b.onclick=()=>jouer(n.son);}
for(const n of N){n.el.onmouseenter=()=>montrer(n);n.el.onmouseleave=()=>{bulle.style.display='none';};const sb=n.el.querySelector('.son');if(sb)sb.onclick=e=>{e.stopPropagation();jouer(n.son);};}
bulle.onmouseenter=()=>bulle.style.display='block';bulle.onmouseleave=()=>bulle.style.display='none';
lent.innerHTML='<option value="">Lentille : aucune</option>'+LEN.map(l=>'<option value="'+l.id+'">Lentille : '+l.nom+'</option>').join('');lent.value=lentille;
function appliquerLentille(){for(const n of N){const a=lentille&&n.particularites&&n.particularites[lentille];n.el.classList.toggle('terne',!!lentille&&!a);let p=n.el.querySelector('.pastille');if(p)p.remove();
 if(a){p=document.createElement('span');p.className='pastille';p.style.background=LEN.find(l=>l.id===lentille).couleur;n.el.appendChild(p);}}}
lent.onchange=()=>{lentille=lent.value;appliquerLentille();};appliquerLentille();if(!LEN.length)lent.style.display='none';
const ESP=[['anatomie','Anatomie'],['physiologie','Physiologie'],['semiologie','Sémiologie'],['physiopathologie','Physiopathologie']];
espaces.innerHTML=ESP.map(([k,l])=>'<button data-e="'+k+'">'+l+'</button>').join('');
const majEsp=()=>espaces.querySelectorAll('button').forEach(b=>b.classList.toggle('actif',b.dataset.e===espace));
espaces.querySelectorAll('button').forEach(b=>b.onclick=()=>{espace=b.dataset.e;majEsp();dessiner();});majEsp();
if(Q.get('fenetre')){const n=byId[Q.get('fenetre')];setTimeout(()=>ouvrirFenetre(n.fenetre,n.texte,n.couleur),0);}
addEventListener('wheel',e=>{if(e.target.closest('#bulle,#fdet'))return;oy-=e.deltaY*0.6;dessiner();},{passive:true});
setTheme();if(Q.get('bulle'))montrer(byId[Q.get('bulle')]);document.title='PRET';
</script></body></html>
